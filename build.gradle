import com.diffplug.spotless.LineEnding

plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id "com.diffplug.spotless" version "7.0.2"
}

version = "${project.mod_version}-${getCheckedOutGitCommitHash()}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

static def getCheckedOutGitCommitHash() {
    'git rev-parse --verify --short HEAD'.execute().text.trim()
}

repositories {
    maven { url = "https://maven.terraformersmc.com/" }
    maven { url "https://maven.isxander.dev/releases" }
}

loom {
    runs {
        remove server
    }

    accessWidenerPath = file("src/main/resources/animatium.accesswidener")
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft("com.mojang:minecraft:${project.minecraft_version}")
    mappings(loom.officialMojangMappings())
    modImplementation("net.fabricmc:fabric-loader:${project.loader_version}")

    // Fabric API - Needs to be specified, otherwise an older version might be defaulted and cause issues.
    modImplementation(fabricApi.module("fabric-resource-loader-v0", project.fabric_version))
    modImplementation(fabricApi.module("fabric-networking-api-v1", project.fabric_version))
    modImplementation(fabricApi.module("fabric-command-api-v2", project.fabric_version))

    // YACL - TO BE REPLACED WITH LIGHTCONFIG
    if (project.hasProperty("yacl_version")) {
        modImplementation("dev.isxander:yet-another-config-lib:${project.yacl_version}") {
            exclude group: 'net.fabricmc.fabric-api'
        }
    }

    // Mod Menu
    if (project.hasProperty("modmenu_version")) {
        modImplementation("com.terraformersmc:modmenu:${project.modmenu_version}") {
            exclude group: 'net.fabricmc.fabric-api'
        }
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
    }
}

// Header
spotless {
    def licenseHeader = rootProject.file("HEADER")
    java {
        licenseHeaderFile(licenseHeader)
    }
    spotless.setLineEndings(LineEnding.UNIX)
}
